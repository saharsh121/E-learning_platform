<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result | EduMania</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
        }
        .navbar {
            background: linear-gradient(135deg, #8B0000, #DC143C);
            padding: 12px 0;
        }
        .navbar-brand {
            color: white !important;
            font-size: 24px;
            font-weight: 700;
        }
        .navbar-brand i { margin-right: 10px; }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            border-left: 6px solid #DC143C;
        }
        .result-card .score {
            font-size: 72px;
            font-weight: 700;
            color: #DC143C;
        }
        .result-card .percentage {
            font-size: 48px;
            font-weight: 700;
        }
        .result-card .status {
            font-size: 24px;
            font-weight: 600;
        }
        .result-card .status.passed { color: #28a745; }
        .result-card .status.failed { color: #dc3545; }

        .stat-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 32px;
            font-weight: 700;
        }
        .stat-item .label {
            color: #666;
            font-size: 14px;
        }
        .stat-item .icon { font-size: 28px; }
        .stat-item.correct .number { color: #28a745; }
        .stat-item.wrong .number { color: #dc3545; }
        .stat-item.unanswered .number { color: #ffc107; }

        .answer-review {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #DC143C;
        }
        .answer-review.correct { border-left-color: #28a745; }
        .answer-review.wrong { border-left-color: #dc3545; }
        .answer-review .badge-correct { background: #28a745; color: white; }
        .answer-review .badge-wrong { background: #dc3545; color: white; }

        .btn-dashboard {
            background: #DC143C;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-dashboard:hover {
            background: #8B0000;
            color: white;
        }
        .btn-review { 
            background: #6c757d; 
            color: white; 
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-review:hover { background: #5a6268; color: white; }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/student/quizzes" class="navbar-brand">
                <i class="bi bi-mortarboard-fill"></i> EduMania
            </a>
            <div>
                <span class="text-white me-3" th:text="${student.firstName}">Student</span>
                <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="color: #DC143C;"><i class="bi bi-trophy"></i> Quiz Result</h2>
            <a href="/student/quizzes" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back to Quizzes
            </a>
        </div>

        <!-- Result Card -->
        <div class="result-card mb-4">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="score" th:text="${attempt.score}">10</div>
                    <p class="text-muted">out of <span th:text="${attempt.totalMarks}">20</span> marks</p>
                </div>
                <div class="col-md-6">
                    <div class="percentage" th:text="${#numbers.formatDecimal(attempt.percentage, 1, 1)} + '%'">75%</div>
                    <div class="status" th:classappend="${attempt.result == 'Passed' ? 'passed' : 'failed'}" th:text="${attempt.result}">Passed</div>
                    <div class="mt-2">
                        <span class="badge bg-secondary">Quiz Completed</span>
                        <span class="badge bg-info" th:text="${attempt.timeTaken} + ' sec'">90 sec</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="stat-item correct">
                    <div class="icon"><i class="bi bi-check-circle-fill text-success"></i></div>
                    <div class="number" th:text="${attempt.correctAnswers}">3</div>
                    <div class="label">Correct</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-item wrong">
                    <div class="icon"><i class="bi bi-x-circle-fill text-danger"></i></div>
                    <div class="number" th:text="${attempt.wrongAnswers}">1</div>
                    <div class="label">Wrong</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-item unanswered">
                    <div class="icon"><i class="bi bi-question-circle-fill text-warning"></i></div>
                    <div class="number" th:text="${attempt.unanswered}">1</div>
                    <div class="label">Unanswered</div>
                </div>
            </div>
        </div>

        <!-- Answer Review -->
        <h5 class="mb-3"><i class="bi bi-list-check"></i> Answer Review</h5>
        <div th:each="answer : ${attempt.studentAnswers}">
            <div class="answer-review" th:classappend="${answer.isCorrect} ? 'correct' : 'wrong'">
                <div class="d-flex justify-content-between">
                    <h6 th:text="${answer.questionText}">Question</h6>
                    <span th:if="${answer.isCorrect}" class="badge badge-correct">Correct ✓</span>
                    <span th:unless="${answer.isCorrect}" class="badge badge-wrong">Wrong ✗</span>
                </div>
                <div class="row mt-2">
                    <div class="col-md-6">
                        <strong>Your Answer:</strong> 
                        <span th:if="${answer.studentAnswer != -1}" th:text="${answer.studentAnswer}">0</span>
                        <span th:unless="${answer.studentAnswer != -1}" class="text-muted">Not answered</span>
                    </div>
                    <div class="col-md-6">
                        <strong>Correct Answer:</strong> 
                        <span th:text="${answer.correctOptionIndex}">0</span>
                        <span class="text-muted small"> (Option <span th:text="${answer.correctOptionIndex + 1}">1</span>)</span>
                    </div>
                </div>
                <div th:if="${answer.explanation}" class="mt-2">
                    <small class="text-muted"><i class="bi bi-lightbulb"></i> <span th:text="${answer.explanation}">Explanation</span></small>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="text-center mt-4">
            <a href="/student/quizzes" class="btn-dashboard me-2">
                <i class="bi bi-arrow-left"></i> Back to Quizzes
            </a>
            <a href="/student-dashboard" class="btn-dashboard">
                <i class="bi bi-house"></i> Dashboard
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
