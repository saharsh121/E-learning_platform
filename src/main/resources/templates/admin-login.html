<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | EduMania</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="css/admin-login.css">

</head>

<body>

<nav class="navbar">

<div class="container">

<a href="/" class="navbar-brand">

<i class="bi bi-mortarboard-fill"></i>

EduMania

</a>

</div>

</nav>

<section class="login-container">

<div class="left-section">

<img src="images/admin-login.png" alt="Admin">

<h2>Administrator Portal</h2>

<p>

Manage students, faculty, departments, courses,
reports and complete platform administration.

</p>

</div>

<div class="right-section">

<div class="login-card">

<div class="text-center mb-4">

<i class="bi bi-shield-lock-fill"
style="font-size:65px;color:#0B4F3A;"></i>

<h2 class="mt-2">Admin Login</h2>

<p>Secure Access Only</p>

</div>

<form action="/admin/login" method="post">

<div class="form-group">

<label>Admin Email</label>

<input type="email" name="email" class="form-control" placeholder="Enter Admin Email">

</div>

<div class="form-group">

<label>Password</label>

<input type="password" name="password" class="form-control" placeholder="Enter Password">

</div>

<div class="options">

<div>

<input type="checkbox">

Remember Me

</div>

<a href="#">Forgot Password?</a>

</div>

<button type="submit" class="login-btn">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</form>

<div class="register">

Need Help?

<a href="#">Contact System Administrator</a>

</div>

<hr>

<div class="text-center">

<a href="index.html" class="text-decoration-none">

<i class="bi bi-arrow-left-circle"></i>

Back to Home

</a>

</div>

</div>

</div>

</section>

</body>

</html>
