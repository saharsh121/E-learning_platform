<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books | EduMania</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/student-dashboard.css">
    <link rel="stylesheet" href="/css/books.css">
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-mortarboard-fill"></i>
        <h3>EduMania</h3>
        <span>Student Portal</span>
    </div>
    <ul class="sidebar-menu">
        <li><i class="bi bi-speedometer2"></i><a href="/student-dashboard">Dashboard</a></li>
        <li><i class="bi bi-journal-bookmark-fill"></i><a href="/student-dashboard#enrolled-courses">My Courses</a></li>
        <li><i class="bi bi-plus-circle"></i><a href="/student-dashboard#available-courses">Available Courses</a></li>
        <li><i class="bi bi-file-earmark-text"></i><a href="/resources">Resources</a></li>
        <li class="active"><i class="bi bi-book-half"></i><a href="/books">Books</a></li>
        <li><i class="bi bi-question-circle"></i><a href="/student/quizzes">Quizzes</a></li>
    </ul>
    <div class="sidebar-footer">
        <div class="user-card">
            <img th:src="'https://ui-avatars.com/api/?name=' + ${student.firstName} + '+' + ${student.lastName} + '&background=0B4F3A&color=fff&size=40'" alt="User">
            <div class="user-info">
                <h6 th:text="${student.firstName + ' ' + student.lastName}">Student</h6>
                <small>Student</small>
            </div>
            <a href="/logout" class="logout-btn" aria-label="Log out"><i class="bi bi-box-arrow-right"></i></a>
        </div>
    </div>
</div>

<main class="main-content">
    <div class="top-header">
        <h4>Books</h4>
        <div class="header-right">
            <span>Welcome, <strong th:text="${student.firstName}">Student</strong>!</span>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}"></span>
    </div>

    <section class="section-card">
        <div class="card-header-custom">
            <h5><i class="bi bi-book-half"></i> All Books</h5>
            <span class="badge bg-danger" th:text="${books.size()}">0</span>
        </div>
        <div th:if="${books.isEmpty()}" class="text-center py-5">
            <i class="bi bi-book text-muted books-empty-icon"></i>
            <p class="mt-3 mb-0">No books have been uploaded yet.</p>
        </div>
        <div class="row g-3" th:if="${!books.isEmpty()}">
            <div class="col-md-6 col-xl-4" th:each="book : ${books}">
                <article class="book-card">
                    <div class="book-card-icon"><i class="bi bi-file-earmark-pdf"></i></div>
                    <h6 th:text="${book.title}">Book Title</h6>
                    <p class="book-description" th:if="${!#strings.isEmpty(book.description)}"
                       th:text="${book.description}">Book description</p>
                    <small class="book-uploader" th:if="${!#strings.isEmpty(book.uploadedBy)}"
                           th:text="'Uploaded by ' + ${book.uploadedBy}">Uploaded by Faculty</small>
                    <a class="btn btn-danger btn-sm" th:href="${book.fileUrl}">
                        <i class="bi bi-download"></i> Download Book
                    </a>
                </article>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/student-dashboard.js"></script>
</body>
</html>
