<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | EduMania</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/student-login.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="container">

            <a href="/" class="navbar-brand">
                <i class="bi bi-mortarboard-fill"></i>
                EduMania
            </a>

        </div>

    </nav>

    <!-- ================= LOGIN SECTION ================= -->

    <section class="login-container">

        <!-- Left Section -->

        <div class="left-section">

            <img src="images/student-login.png" alt="Student Login">

            <h2>Welcome Back!</h2>

            <p>

                Access your courses, assignments, quizzes, certificates,
                and learning progress from one place.

            </p>

        </div>

        <!-- Right Section -->

        <div class="right-section">

            <div class="login-card">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle"
                        style="font-size:65px;color:#0B4F3A;"></i>

                    <h2 class="mt-2">Student Login</h2>

                    <p>Please login to continue</p>

                </div>

                <form action="/student/login" method="post">

                    <!-- Email -->

                    <div class="form-group">

                        <label>

                            <i class="bi bi-envelope-fill"></i>

                            Email Address

                        </label>

                        <input type="email"
                            class="form-control"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label>

                            <i class="bi bi-lock-fill"></i>

                            Password

                        </label>

                        <input type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <!-- Remember -->

                    <div class="options">

                        <div>

                            <input type="checkbox" id="remember">

                            <label for="remember">
                                Remember Me
                            </label>

                        </div>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                    <!-- Login -->

                    <button type="submit" class="login-btn">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>


                </form>

                <!-- Register -->

                <div class="register">

                    Don't have an account?

                    <a href="#">

                        Register Now

                    </a>

                </div>

                <hr>

                <div class="text-center">

                    <a href="index.html"
                        class="text-decoration-none">

                        <i class="bi bi-arrow-left-circle"></i>

                        Back to Home

                    </a>

                </div>

            </div>

        </div>

    </section>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/student-login.js"></script>

</body>

</html>
