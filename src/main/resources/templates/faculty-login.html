<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty Login | EduMania</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/faculty-login.css">

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a href="/" class="navbar-brand">

            <i class="bi bi-mortarboard-fill"></i>

            EduMania

        </a>

    </div>

</nav>

<section class="login-container">

<div class="left-section">

    <img src="images/faculty-login.png" alt="Faculty">

    <h2>Welcome Faculty</h2>

    <p>

        Manage courses, upload study material, create assignments,
        conduct quizzes and track student performance.

    </p>

</div>

<div class="right-section">

<div class="login-card">

<div class="text-center mb-4">

<i class="bi bi-person-workspace" style="font-size:65px;color:#0B4F3A;"></i>

<h2 class="mt-2">Faculty Login</h2>

<p>Please login to continue</p>

</div>

<form action="/faculty/login" method="post">

<div class="form-group">

<label>Email Address</label>

<input type="email" name="email" class="form-control" placeholder="Enter Faculty Email">

</div>

<div class="form-group">

<label>Password</label>

<input type="password" name="password" class="form-control" placeholder="Enter Password">

</div>

<div class="options">

<div>

<input type="checkbox">

Remember Me

</div>

<a href="#">Forgot Password?</a>

</div>

<button type="submit" class="login-btn">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</form>

<div class="register">

Need Help?

<a href="#">Contact Admin</a>

</div>

<hr>

<div class="text-center">

<a href="index.html" class="text-decoration-none">

<i class="bi bi-arrow-left-circle"></i>

Back to Home

</a>

</div>

</div>

</div>

</section>

</body>

</html>
