# Server configuration
server.port=8080

# Spring configuration
spring.application.name=edumania

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Static resources - COMBINED into one line
spring.web.resources.static-locations=classpath:/static/,file:src/main/resources/static/uploads/

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=edumania

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB